version: '3.8'

services:
  deep-research:
    container_name: deep-research
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "3051:3051"
    environment:
      # You can set these environment variables here or use a .env file
      - NODE_ENV=production
      - PORT=3051
      # Uncomment and set your API keys:
      # - FIRECRAWL_KEY="fc-ce6a94e8422a427bb55d7f34b7e9bf06"
      # - OPENAI_KEY="sk-mFlSYAwBoIHaIykVE8C3Fc89D6C34c4bA638FcA99cD79aDf"
      # - SERPAPI_KEY="your_serpapi_key_here"
      # - CONTEXT_SIZE="128000"
      # - OPENAI_ENDPOINT="http://openai-proxy.miracleplus.com/v1"

    # Uncomment to use a .env file instead:
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - deep-research-network

  # Optional: Add a development service that mounts the source code
  deep-research-dev:
    container_name: deep-research-dev
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "3052:3051"
    environment:
      - NODE_ENV=development
      - PORT=3051
    env_file:
      - .env.local
    volumes:
      - ./src:/app/src:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
    restart: unless-stopped
    networks:
      - deep-research-network
    profiles:
      - dev

networks:
  deep-research-network:
    driver: bridge
